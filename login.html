<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bidly — Sign in</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="css/auth.css"></head><body><main class="auth-shell"><section class="auth-card"><a class="brand" href="index.html"><b>B</b>bidly<span>.</span></a><small class="eyebrow">WELCOME BACK</small><h1>Sign in to Bidly</h1><p>Access your watchlist, bids and account.</p><form id="loginForm"><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" required></label><button class="primary" type="submit">Sign in</button><div id="message"></div></form><p>New to Bidly? <a href="register.html">Create an account</a></p></section></main><script src="js/auth.js"></script><script>document.querySelector('#loginForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const r=await loginUser(f.get('email'),f.get('password'));const m=document.querySelector('#message');m.textContent=r.message||(r.success?'Signed in.':'Unable to sign in.');if(r.success)setTimeout(()=>location.href='index.html',500)}</script></body></html>
