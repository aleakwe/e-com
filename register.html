<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bidly — Create account</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="css/auth.css"></head><body><main class="auth-shell"><section class="auth-card"><a class="brand" href="index.html"><b>B</b>bidly<span>.</span></a><small class="eyebrow">JOIN THE MARKETPLACE</small><h1>Create your account</h1><p>Register to save lots and place bids.</p><form id="registerForm"><label>Name<input type="text" name="name" required></label><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="8" required></label><button class="primary" type="submit">Create account</button><div id="message"></div></form><p>Already registered? <a href="login.html">Sign in</a></p></section></main><script src="js/auth.js"></script><script>document.querySelector('#registerForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const r=await fetch('php/auth/register.php',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({name:f.get('name'),email:f.get('email'),password:f.get('password')})}).then(x=>x.json());const m=document.querySelector('#message');m.textContent=r.message||(r.success?'Account created.':'Unable to register.');if(r.success)setTimeout(()=>location.href='index.html',700)}</script></body></html>
